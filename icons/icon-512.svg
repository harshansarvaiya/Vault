  <path d="M256 115 L352 158 C352 260 310 345 256 392 C202 345 160 260 160 158 Z" 
        fill="#0a1420" stroke="#00f0ff" stroke-width="3" opacity="0.85" />
  <!-- Quantum Keyhole / Target -->
