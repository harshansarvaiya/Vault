<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="100%" stop-color="#0e1724" />
    </linearGradient>
    <linearGradient id="cyanGlow512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad512)" stroke="#1a2b40" stroke-width="4" />
  <!-- Shield Outer -->
  <path d="M256 75 L390 135 C390 270 336 380 256 440 C176 380 122 270 122 135 Z" 
        fill="none" stroke="url(#cyanGlow512)" stroke-width="10" filter="url(#glow512)" />
