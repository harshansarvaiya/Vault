  <circle cx="256" cy="230" r="14" fill="#00ff88" />
  <path d="M256 262 L256 316" stroke="#00ff88" stroke-width="10" stroke-linecap="round" />
  <!-- Tactical Reticles -->
  <line x1="256" y1="165" x2="256" y2="182" stroke="#00f0ff" stroke-width="5" />
  <line x1="256" y1="338" x2="256" y2="355" stroke="#00f0ff" stroke-width="5" />
  <line x1="192" y1="230" x2="209" y2="230" stroke="#00f0ff" stroke-width="5" />
  <line x1="303" y1="230" x2="320" y2="230" stroke="#00f0ff" stroke-width="5" />
</svg>
