<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceCore512" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>
    <linearGradient id="goldRelic512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="plasmaCyan512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="relicGlow512" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Obsidian Rounded Octagon Shield -->
  <rect width="512" height="512" rx="112" fill="url(#spaceCore512)" stroke="#1a2638" stroke-width="4" />

  <!-- Outer Sacred Geometry Ring & Tech Ticks -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="#22334a" stroke-width="3" stroke-dasharray="16 10" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldRelic512)" stroke-width="2.5" opacity="0.6" />

  <!-- Ancient Yantra Diamond (Kūṭa Geometry) -->
  <polygon points="256,76 436,256 256,436 76,256" fill="none" stroke="url(#goldRelic512)" stroke-width="5" filter="url(#relicGlow512)" />
  <polygon points="256,118 394,256 256,394 118,256" fill="#060b13" stroke="#00f0ff" stroke-width="3.5" opacity="0.8" />

  <!-- Ancient Intersecting Triangles (Yantra Matrix) -->
  <polygon points="256,138 380,346 132,346" fill="none" stroke="url(#goldRelic512)" stroke-width="2.5" opacity="0.4" />
  <polygon points="256,374 380,166 132,166" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.4" />

  <!-- Central Sci-Fi 'X' Core (The Quantum Nexus) -->
  <path d="M192 192 L320 320" stroke="url(#plasmaCyan512)" stroke-width="14" stroke-linecap="round" filter="url(#relicGlow512)" />
  <path d="M320 192 L192 320" stroke="url(#plasmaCyan512)" stroke-width="14" stroke-linecap="round" filter="url(#relicGlow512)" />

  <!-- Ancient Core Eye / Drishti Center Node -->
  <circle cx="256" cy="256" r="38" fill="#040810" stroke="url(#goldRelic512)" stroke-width="6" />
  <circle cx="256" cy="256" r="16" fill="#00f0ff" filter="url(#relicGlow512)" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />

  <!-- 4 Cardinal Celestial Nodes -->
  <circle cx="256" cy="76" r="9" fill="#f59e0b" />
  <circle cx="436" cy="256" r="9" fill="#f59e0b" />
  <circle cx="256" cy="436" r="9" fill="#f59e0b" />
  <circle cx="76" cy="256" r="9" fill="#f59e0b" />
</svg>
