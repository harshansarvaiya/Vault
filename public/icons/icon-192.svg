  <path d="M96 42 L132 58 C132 96 116 128 96 146 C76 128 60 96 60 58 Z" 
        fill="#0b131e" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />
  <!-- Quantum Keyhole / Target -->
  <circle cx="96" cy="86" r="14" fill="none" stroke="#00ff88" stroke-width="3" />
  <circle cx="96" cy="86" r="5" fill="#00ff88" />
  <path d="M96 98 L96 118" stroke="#00ff88" stroke-width="4" stroke-linecap="round" />
  <!-- Tactical Reticles -->
  <line x1="96" y1="62" x2="96" y2="68" stroke="#00f0ff" stroke-width="2" />
  <line x1="96" y1="126" x2="96" y2="132" stroke="#00f0ff" stroke-width="2" />
  <line x1="72" y1="86" x2="78" y2="86" stroke="#00f0ff" stroke-width="2" />
  <line x1="114" y1="86" x2="120" y2="86" stroke="#00f0ff" stroke-width="2" />
</svg>
