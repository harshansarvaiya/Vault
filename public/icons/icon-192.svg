<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="100%" stop-color="#0f1724" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" rx="36" fill="url(#bgGrad)" stroke="#1a2636" stroke-width="2" />
  <!-- Shield Outer -->
  <path d="M96 28 L146 50 C146 100 126 142 96 164 C66 142 46 100 46 50 Z" 
        fill="none" stroke="url(#cyanGlow)" stroke-width="4" filter="url(#glow)" />
