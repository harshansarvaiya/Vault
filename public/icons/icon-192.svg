<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="spaceCore" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>
    <linearGradient id="goldRelic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="plasmaCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="relicGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Obsidian Rounded Octagon Shield -->
  <rect width="192" height="192" rx="42" fill="url(#spaceCore)" stroke="#1a2638" stroke-width="2" />

  <!-- Outer Sacred Geometry Ring & Tech Ticks -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="#22334a" stroke-width="1.5" stroke-dasharray="6 4" />
  <circle cx="96" cy="96" r="68" fill="none" stroke="url(#goldRelic)" stroke-width="1.2" opacity="0.6" />

  <!-- Ancient Yantra Diamond (Kūṭa Geometry) -->
  <polygon points="96,28 164,96 96,164 28,96" fill="none" stroke="url(#goldRelic)" stroke-width="2" filter="url(#relicGlow)" />
  <polygon points="96,44 148,96 96,148 44,96" fill="#060b13" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />

  <!-- Ancient Intersecting Triangles (Yantra Matrix) -->
  <polygon points="96,52 142,130 50,130" fill="none" stroke="url(#goldRelic)" stroke-width="1" opacity="0.4" />
  <polygon points="96,140 142,62 50,62" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4" />

  <!-- Central Sci-Fi 'X' Core (The Quantum Nexus) -->
  <path d="M72 72 L120 120" stroke="url(#plasmaCyan)" stroke-width="5" stroke-linecap="round" filter="url(#relicGlow)" />
  <path d="M120 72 L72 120" stroke="url(#plasmaCyan)" stroke-width="5" stroke-linecap="round" filter="url(#relicGlow)" />

  <!-- Ancient Core Eye / Drishti Center Node -->
  <circle cx="96" cy="96" r="14" fill="#040810" stroke="url(#goldRelic)" stroke-width="2.5" />
  <circle cx="96" cy="96" r="6" fill="#00f0ff" filter="url(#relicGlow)" />
  <circle cx="96" cy="96" r="2.5" fill="#ffffff" />

  <!-- 4 Cardinal Celestial Nodes -->
  <circle cx="96" cy="28" r="3.5" fill="#f59e0b" />
  <circle cx="164" cy="96" r="3.5" fill="#f59e0b" />
  <circle cx="96" cy="164" r="3.5" fill="#f59e0b" />
  <circle cx="28" cy="96" r="3.5" fill="#f59e0b" />
</svg>
